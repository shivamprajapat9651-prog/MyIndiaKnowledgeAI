<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GURUJIAI - AI Teacher</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Hind:wght@400;500;600&display=swap');
  :root{--saffron:#FF6B00;--purple:#6C1FBE;--gold:#FFD700;--mint:#00E5A0;--pink:#FF4D8D;--bg:#0D0120;--card:#1E0840;--text:#F0E6FF;--soft:#9B7EC8}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Hind',sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  body::before{content:'';position:fixed;top:-100px;left:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(108,31,190,0.3) 0%,transparent 70%);pointer-events:none;z-index:0}

  .header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(30,8,64,0.97);border-bottom:1px solid rgba(108,31,190,0.4);position:relative;z-index:20}
  .guru-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--saffron),var(--purple));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;position:relative;box-shadow:0 0 12px rgba(255,107,0,0.5)}
  .guru-avatar::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--saffron);animation:pulse-ring 2s ease-in-out infinite}
  @keyframes pulse-ring{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(1.1)}}
  .header-info{flex:1;min-width:0}
  .header-name{font-family:'Baloo 2',cursive;font-weight:800;font-size:17px;background:linear-gradient(90deg,var(--gold),var(--saffron));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .header-status{font-size:10px;color:var(--mint);display:flex;align-items:center;gap:4px}
  .status-dot{width:6px;height:6px;background:var(--mint);border-radius:50%;animation:blink 1.5s ease-in-out infinite;flex-shrink:0}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
  .timer-badge{background:rgba(255,107,0,0.2);border:1px solid rgba(255,107,0,0.4);border-radius:12px;padding:3px 8px;font-size:10px;color:var(--saffron);font-weight:600}
  .timer-badge.warning{background:rgba(255,77,141,0.2);border-color:rgba(255,77,141,0.4);color:var(--pink);animation:blink 1s ease-in-out infinite}
  .hbtn{width:34px;height:34px;border-radius:10px;border:1px solid rgba(108,31,190,0.5);background:rgba(108,31,190,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--soft)}
  .hbtn:active{background:rgba(108,31,190,0.5)}

  .speaking-ind{display:none;align-items:center;gap:2px;padding:3px 8px;background:rgba(0,229,160,0.15);border:1px solid rgba(0,229,160,0.3);border-radius:20px;font-size:10px;color:var(--mint)}
  .speaking-ind.show{display:flex}
  .speak-bar{width:2px;background:var(--mint);border-radius:2px;animation:speak-anim 0.6s ease-in-out infinite alternate}
  .speak-bar:nth-child(1){height:4px}.speak-bar:nth-child(2){height:9px;animation-delay:0.1s}.speak-bar:nth-child(3){height:13px;animation-delay:0.2s}.speak-bar:nth-child(4){height:9px;animation-delay:0.3s}.speak-bar:nth-child(5){height:4px;animation-delay:0.4s}
  @keyframes speak-anim{from{transform:scaleY(0.4)}to{transform:scaleY(1)}}

  /* SIDEBAR */
  .sidebar{position:fixed;top:0;left:0;width:280px;height:100%;background:#0A0118;border-right:1px solid rgba(108,31,190,0.4);z-index:100;transform:translateX(-100%);transition:transform 0.3s ease;display:flex;flex-direction:column}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99;display:none}
  .sidebar-overlay.show{display:block}
  .sidebar-header{padding:14px;background:rgba(30,8,64,0.9);border-bottom:1px solid rgba(108,31,190,0.3);display:flex;align-items:center;justify-content:space-between}
  .sidebar-title{font-family:'Baloo 2',cursive;font-weight:800;font-size:15px;background:linear-gradient(90deg,var(--gold),var(--saffron));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .close-sb{background:none;border:none;color:var(--soft);font-size:18px;cursor:pointer}
  .new-chat-btn{margin:10px;padding:11px;background:linear-gradient(135deg,var(--saffron),var(--purple));border:none;border-radius:12px;color:white;font-size:13px;font-family:'Hind',sans-serif;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;justify-content:center}
  .new-chat-btn:active{transform:scale(0.97)}
  .chat-list{flex:1;overflow-y:auto;padding:6px}
  .chat-list::-webkit-scrollbar{width:3px}
  .chat-list::-webkit-scrollbar-thumb{background:var(--purple);border-radius:10px}
  .chat-item{padding:11px;border-radius:10px;cursor:pointer;margin-bottom:3px;border:1px solid transparent;position:relative}
  .chat-item:active,.chat-item.active{background:rgba(108,31,190,0.25);border-color:rgba(108,31,190,0.4)}
  .chat-item.active{border-color:var(--saffron)}
  .chat-item-title{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-item-time{font-size:10px;color:var(--soft);margin-top:2px}
  .chat-del{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--soft);font-size:14px;cursor:pointer;padding:4px}
  .no-chats{text-align:center;padding:30px 16px;color:var(--soft);font-size:13px}

  /* MESSAGES */
  .messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1;scroll-behavior:smooth}
  .messages::-webkit-scrollbar{width:3px}
  .messages::-webkit-scrollbar-thumb{background:var(--purple);border-radius:10px}
  .msg-row{display:flex;gap:8px;align-items:flex-end;animation:fadeUp 0.3s ease forwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .msg-row.user{flex-direction:row-reverse}
  .msg-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .msg-avatar.ai{background:linear-gradient(135deg,var(--saffron),var(--purple));box-shadow:0 0 8px rgba(255,107,0,0.4)}
  .msg-avatar.user-av{background:linear-gradient(135deg,var(--mint),#0090FF)}
  .bubble-wrap{max-width:82%}
  .bubble{padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.65;word-break:break-word}
  .bubble.ai{background:var(--card);border:1px solid rgba(108,31,190,0.35);border-bottom-left-radius:4px}
  .bubble.user{background:linear-gradient(135deg,var(--purple),#9B2EFF);border-bottom-right-radius:4px;color:white}
  .bubble-actions{display:flex;gap:6px;margin-top:4px;align-items:center;flex-wrap:wrap}
  .bubble-time{font-size:10px;color:var(--soft);opacity:0.7}
  .action-btn{background:none;border:none;cursor:pointer;font-size:11px;color:var(--soft);padding:2px 6px;border-radius:6px;font-family:'Hind',sans-serif}
  .action-btn:active{background:rgba(255,255,255,0.08);color:white}
  .action-btn.copied{color:var(--mint)}
  .live-cursor{display:inline-block;width:2px;height:13px;background:var(--saffron);margin-left:2px;animation:cursor-blink 0.7s ease-in-out infinite;vertical-align:middle}
  @keyframes cursor-blink{0%,100%{opacity:1}50%{opacity:0}}
  .typing-bubble{display:flex;gap:5px;align-items:center;padding:13px 16px}
  .typing-bubble span{width:7px;height:7px;background:var(--soft);border-radius:50%;animation:typing 1.2s ease-in-out infinite}
  .typing-bubble span:nth-child(2){animation-delay:0.2s}
  .typing-bubble span:nth-child(3){animation-delay:0.4s}
  @keyframes typing{0%,100%{transform:translateY(0);opacity:0.4}50%{transform:translateY(-6px);opacity:1}}

  /* CREATOR CARD */
  .creator-card{background:linear-gradient(135deg,rgba(108,31,190,0.3),rgba(255,107,0,0.15));border:1px solid rgba(255,215,0,0.3);border-radius:16px;padding:16px;text-align:center;animation:fadeUp 0.3s ease}
  .creator-photo{width:90px;height:90px;border-radius:50%;object-fit:cover;object-position:center top;border:3px solid var(--saffron);box-shadow:0 0 20px rgba(255,107,0,0.5);margin:0 auto 10px}
  .creator-name{font-family:'Baloo 2',cursive;font-weight:800;font-size:16px;background:linear-gradient(90deg,var(--gold),var(--saffron));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
  .creator-desc{font-size:12px;color:var(--soft);line-height:1.6}

  /* QUICK */
  .quick-wrap{padding:6px 12px;display:flex;gap:7px;overflow-x:auto;position:relative;z-index:1}
  .quick-wrap::-webkit-scrollbar{display:none}
  .quick-btn{background:rgba(108,31,190,0.2);border:1px solid rgba(108,31,190,0.5);border-radius:20px;padding:5px 12px;font-size:11.5px;color:var(--soft);white-space:nowrap;cursor:pointer;font-family:'Hind',sans-serif}
  .quick-btn:active{background:rgba(108,31,190,0.6);color:white}

  /* INPUT */
  .input-bar{padding:10px 12px 16px;background:rgba(30,8,64,0.97);border-top:1px solid rgba(108,31,190,0.3);display:flex;gap:8px;align-items:flex-end;position:relative;z-index:10}
  .input-wrap{flex:1;background:rgba(255,255,255,0.07);border:1.5px solid rgba(108,31,190,0.4);border-radius:24px;display:flex;align-items:flex-end;padding:8px 13px;gap:7px;transition:border-color 0.2s}
  .input-wrap:focus-within{border-color:var(--saffron);box-shadow:0 0 12px rgba(255,107,0,0.2)}
  #userInput{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px;font-family:'Hind',sans-serif;resize:none;max-height:100px;min-height:24px;line-height:1.5}
  #userInput::placeholder{color:var(--soft);opacity:0.6}
  .mic-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--soft);flex-shrink:0;border-radius:50%}
  .mic-btn.listening{color:var(--pink);animation:mic-pulse 0.8s ease-in-out infinite;background:rgba(255,77,141,0.15)}
  @keyframes mic-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
  .send-btn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--saffron),var(--purple));border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 4px 15px rgba(255,107,0,0.4)}
  .send-btn:active{transform:scale(0.9)}
  .send-btn:disabled{opacity:0.5;cursor:not-allowed}
  .send-btn svg{width:18px;height:18px;fill:white}

  .welcome-card{background:linear-gradient(135deg,rgba(108,31,190,0.3),rgba(255,107,0,0.15));border:1px solid rgba(255,215,0,0.2);border-radius:16px;padding:14px;text-align:center}
  .welcome-emoji{font-size:32px;margin-bottom:5px}
  .welcome-title{font-family:'Baloo 2',cursive;font-weight:800;font-size:19px;background:linear-gradient(90deg,var(--gold),var(--saffron));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .welcome-sub{font-size:12px;color:var(--soft);margin-top:2px}

  /* SESSION EXPIRED */
  .session-screen{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
  .session-screen.show{display:flex}
  .session-icon{font-size:60px;margin-bottom:16px}
  .session-title{font-family:'Baloo 2',cursive;font-weight:800;font-size:22px;background:linear-gradient(90deg,var(--gold),var(--saffron));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
  .session-sub{color:var(--soft);font-size:14px;line-height:1.7;margin-bottom:24px}
  .session-restart{padding:12px 28px;background:linear-gradient(135deg,var(--saffron),var(--purple));border:none;border-radius:24px;color:white;font-size:15px;font-family:'Hind',sans-serif;font-weight:600;cursor:pointer}

  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,229,160,0.9);color:#000;padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">📚 मेरी Chats</span>
    <button class="close-sb" onclick="closeSidebar()">✕</button>
  </div>
  <button class="new-chat-btn" onclick="newChat()">✏️ नई Chat शुरू करो</button>
  <div class="chat-list" id="chatList"></div>
</div>

<div class="header">
  <div class="hbtn" onclick="openSidebar()">☰</div>
  <div class="guru-avatar">🧑‍🏫</div>
  <div class="header-info">
    <div class="header-name" id="headerName">GURUJIAI</div>
    <div class="header-status">
      <div class="status-dot"></div>
      <span id="statusText">तैयार हूँ!</span>
    </div>
  </div>
  <div class="speaking-ind" id="speakInd">
    <div class="speak-bar"></div><div class="speak-bar"></div>
    <div class="speak-bar"></div><div class="speak-bar"></div>
    <div class="speak-bar"></div>
  </div>
  <div id="timerBadge" class="timer-badge">⏱ 5:00:00</div>
  <div class="hbtn" onclick="newChat()">✏️</div>
</div>

<div class="messages" id="messages"></div>

<div class="quick-wrap" id="quickWrap">
  <button class="quick-btn" onclick="sendQuick('2×8 कितना होता है?')">➕ Maths</button>
  <button class="quick-btn" onclick="sendQuick('पानी का सूत्र क्या है?')">🧪 Science</button>
  <button class="quick-btn" onclick="sendQuick('भारत की राजधानी कौन सी है?')">🗺️ GK</button>
  <button class="quick-btn" onclick="sendQuick('Hindi nibandh kaise likhte hain?')">✍️ Hindi</button>
  <button class="quick-btn" onclick="sendQuick('What is a noun?')">🔤 English</button>
</div>

<div class="input-bar">
  <div class="input-wrap">
    <textarea id="userInput" placeholder="सवाल पूछो यहाँ..." rows="1"
      oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
    <div class="mic-btn" id="micBtn" onclick="toggleVoice()">🎙️</div>
  </div>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<div class="session-screen" id="sessionScreen">
  <div class="session-icon">⏰</div>
  <div class="session-title">Session खत्म हो गया!</div>
  <div class="session-sub">5 घंटे की limit खत्म हो गई।<br>GURUJIAI को फिर से शुरू करो!</div>
  <button class="session-restart" onclick="restartSession()">🔄 फिर से शुरू करो</button>
</div>

<div class="toast" id="toast"></div>

// ---- SESSION TIMER ----
function startTimer(){
  const saved = localStorage.getItem('gurujiai_session_end');
  if(saved){
    const remaining = Math.floor((parseInt(saved) - Date.now()) / 1000);
    if(remaining <= 0){ showSessionExpired(); return; }
    sessionSeconds = remaining;
  } else {
    const endTime = Date.now() + SESSION_HOURS * 3600 * 1000;
    localStorage.setItem('gurujiai_session_end', endTime.toString());
  }
  sessionInterval = setInterval(()=>{
    sessionSeconds--;
    updateTimerDisplay();
    if(sessionSeconds <= 0){ clearInterval(sessionInterval); showSessionExpired(); }
  }, 1000);
  updateTimerDisplay();
}

function updateTimerDisplay(){
  const h = Math.floor(sessionSeconds/3600);
  const m = Math.floor((sessionSeconds%3600)/60);
  const s = sessionSeconds%60;
  timerBadge.textContent = '⏱ ' + String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  if(sessionSeconds <= 600) timerBadge.classList.add('warning');
}

function showSessionExpired(){
  document.getElementById('sessionScreen').classList.add('show');
  stopSpeaking();
  isBusy = true;
  sendBtn.disabled = true;
}

function restartSession(){
  localStorage.removeItem('gurujiai_session_end');
  sessionSeconds = SESSION_HOURS * 3600;
  document.getElementById('sessionScreen').classList.remove('show');
  isBusy = false;
  sendBtn.disabled = false;
  timerBadge.classList.remove('warning');
  startTimer();
  showToast('नया session शुरू! 5 घंटे मिले! 🎉');
}

// ---- CHAT MANAGEMENT ----
function generateId(){ return 'chat_' + Date.now(); }
function saveChats(){ localStorage.setItem('gurujiai_chats', JSON.stringify(allChats)); }

function newChat(){
  closeSidebar();
  const id = generateId();
  allChats[id] = { id, title:'नई Chat', messages:[], created: Date.now() };
  currentChatId = id;
  saveChats();
  renderChatList();
  renderMessages();
  document.getElementById('quickWrap').style.display = 'flex';
  setTimeout(()=>{
    addAIMsg(userName
      ? 'नमस्ते ' + userName + '! 😊 नई chat शुरू! क्या पूछना है? 📚'
      : 'नमस्ते! 😊 नई chat शुरू! कोई भी सवाल पूछो! 🌟'
    , true);
  }, 300);
}

function loadChat(id){
  closeSidebar();
  currentChatId = id;
  renderMessages();
  document.getElementById('quickWrap').style.display = 'none';
  renderChatList();
}

function deleteChat(id, e){
  e.stopPropagation();
  delete allChats[id];
  saveChats();
  if(currentChatId === id){ currentChatId = null; renderMessages(); document.getElementById('quickWrap').style.display='flex'; headerName.textContent='GURUJIAI'; }
  renderChatList();
  showToast('Chat हटाई गई!');
}

function renderChatList(){
  const list = document.getElementById('chatList');
  const chats = Object.values(allChats).sort((a,b)=>b.created-a.created);
  if(chats.length===0){ list.innerHTML='<div class="no-chats">कोई chat नहीं है<br>नई chat शुरू करो! 😊</div>'; return; }
  list.innerHTML = chats.map(c=>'<div class="chat-item '+(c.id===currentChatId?'active':'')+'" onclick="loadChat(\''+c.id+'\')"><div class="chat-item-title">💬 '+escHtml(c.title)+'</div><div class="chat-item-time">'+new Date(c.created).toLocaleDateString('hi-IN')+'</div><button class="chat-del" onclick="deleteChat(\''+c.id+'\',event)">🗑️</button></div>').join('');
}

function renderMessages(){
  msgsDiv.innerHTML = '';
  if(!currentChatId){
    msgsDiv.innerHTML = '<div class="welcome-card"><div class="welcome-emoji">🎓</div><div class="welcome-title">'+(userName?'वापस आए '+userName+'! 🎉':'नमस्ते! मैं GURUJIAI हूँ')+'</div><div class="welcome-sub">'+(userName?'पिछली chats sidebar में देखो! ☰':'तुम्हारा AI गुरुजी — कोई भी सवाल पूछो!')+'</div></div>';
    return;
  }
  const chat = allChats[currentChatId];
  if(!chat) return;
  headerName.textContent = chat.title;
  chat.messages.forEach(m => { if(m.role==='user') _addUserMsgDOM(m.content); else _addAIMsgDOM(m.content, false); });
  msgsDiv.scrollTop = msgsDiv.scrollHeight;
}

// ---- CREATOR CARD ----
function showCreatorCard(){
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = '<div class="msg-avatar ai">🧑‍🏫</div><div class="bubble-wrap"><div class="creator-card"><img src="'+CREATOR_PHOTO+'" class="creator-photo" alt="Creator"/><div class="creator-name">'+CREATOR_NAME+'</div><div class="creator-desc">🙏 GURUJIAI के निर्माता<br>📱 इस AI को बनाने वाले<br><br>✅ अच्छे सवाल पूछो — पढ़ाई, GK, Maths, Science<br>❌ गलत सवाल मत पूछो<br>💡 अपने परिवार को भी बताओ!</div></div><div class="bubble-actions"><span class="bubble-time">'+getTime()+'</span></div></div>';
  msgsDiv.appendChild(row);
  msgsDiv.scrollTop = msgsDiv.scrollHeight;
}

// ---- SIDEBAR ----
function openSidebar(){ renderChatList(); document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('show'); }

// ---- MEMORY ----
function extractInfo(t){
  if(userName) return;
  const np=[/मेरा नाम (.+?) है/i,/मेरा नाम (.+)/i,/my name is (.+)/i,/naam (.+?) hai/i];
  for(const p of np){ const m=t.match(p); if(m&&m[1]&&m[1].trim().length<25){ userName=m[1].trim().replace(/[।.,!?]/g,''); localStorage.setItem('gurujiai_name',userName); break; } }
}

// ---- BAD WORD FILTER ----
const badWords = ['sexy','sex','nude','naked','porn','गंदा','अश्लील','बेशर्म','vulgar','adult'];
function isBadQuestion(text){
  const lower = text.toLowerCase();
  return badWords.some(w => lower.includes(w));
}

// ---- TTS ----
function speakText(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const clean=text.replace(/[^\u0000-\u007E\u0900-\u097F\s]/g,'').trim();
  if(!clean) return;
  const utt=new SpeechSynthesisUtterance(clean);
  utt.lang='hi-IN'; utt.rate=0.9; utt.pitch=1.1; utt.volume=1;
  const voices=window.speechSynthesis.getVoices();
  const hv=voices.find(v=>v.lang.includes('hi')); if(hv) utt.voice=hv;
  utt.onstart=()=>{ isSpeaking=true; speakInd.classList.add('show'); statusText.textContent='बोल रहा हूँ...'; };
  utt.onend=()=>{ isSpeaking=false; speakInd.classList.remove('show'); statusText.textContent=userName?'नमस्ते '+userName+'!':'तैयार हूँ!'; };
  utt.onerror=()=>{ isSpeaking=false; speakInd.classList.remove('show'); };
  window.speechSynthesis.speak(utt);
}
function stopSpeaking(){ window.speechSynthesis?.cancel(); isSpeaking=false; speakInd.classList.remove('show'); }

// ---- VOICE INPUT ----
function toggleVoice(){
  if(isListening){ stopListening(); return; }
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){ showToast('Voice support नहीं है!'); return; }
  stopSpeaking();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR(); recognition.lang='hi-IN'; recognition.continuous=false; recognition.interimResults=true;
  recognition.onstart=()=>{ isListening=true; micBtn.classList.add('listening'); micBtn.textContent='🔴'; statusText.textContent='सुन रहा हूँ...'; };
  recognition.onresult=(e)=>{ let f=''; for(let x=e.resultIndex;x<e.results.length;x++){ if(e.results[x].isFinal) f+=e.results[x][0].transcript; } if(f) userInput.value=f; autoResize(userInput); };
  recognition.onend=()=>{ stopListening(); if(userInput.value.trim()) sendMessage(); };
  recognition.onerror=()=>{ stopListening(); showToast('आवाज़ नहीं सुना!'); };
  recognition.start();
}
function stopListening(){ isListening=false; micBtn.classList.remove('listening'); micBtn.textContent='🎙️'; statusText.textContent=userName?'नमस्ते '+userName+'!':'तैयार हूँ!'; try{ recognition?.stop(); }catch(e){} }

// ---- UI ----
function autoResize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px'; }
function handleKey(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); } }
function getTime(){ return new Date().toLocaleTimeString('hi-IN',{hour:'2-digit',minute:'2-digit'}); }
function escHtml(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

function _addUserMsgDOM(text){
  const row=document.createElement('div'); row.className='msg-row user';
  row.innerHTML='<div class="msg-avatar user-av">👦</div><div class="bubble-wrap"><div class="bubble user">'+escHtml(text)+'</div><div class="bubble-actions"><span class="bubble-time">'+getTime()+'</span></div></div>';
  msgsDiv.appendChild(row); msgsDiv.scrollTop=msgsDiv.scrollHeight;
}

function _addAIMsgDOM(text, animate){
  const id='m'+Date.now()+Math.random().toString(36).slice(2,6);
  const row=document.createElement('div'); row.className='msg-row';
  row.innerHTML='<div class="msg-avatar ai">🧑‍🏫</div><div class="bubble-wrap"><div class="bubble ai" id="'+id+'"></div><div class="bubble-actions"><span class="bubble-time">'+getTime()+'</span><button class="action-btn" onclick="copyMsg(\''+id+'\',this)">📋 Copy</button><button class="action-btn" onclick="speakMsg(\''+id+'\')">🔊 सुनो</button><button class="action-btn" onclick="stopSpeaking()">⏹ रोको</button></div></div>';
  msgsDiv.appendChild(row); msgsDiv.scrollTop=msgsDiv.scrollHeight;
  const bubble=document.getElementById(id);
  if(animate){
    let i=0; const cur=document.createElement('span'); cur.className='live-cursor'; bubble.appendChild(cur);
    const iv=setInterval(()=>{ if(i<text.length){ bubble.insertBefore(document.createTextNode(text[i]),cur); i++; msgsDiv.scrollTop=msgsDiv.scrollHeight; } else{ clearInterval(iv); cur.remove(); speakText(text); } },16);
  } else { bubble.textContent=text; }
}

function addAIMsg(text, animate){ _addAIMsgDOM(text, animate); }

function addTyping(){ const r=document.createElement('div'); r.className='msg-row'; r.id='typRow'; r.innerHTML='<div class="msg-avatar ai">🧑‍🏫</div><div class="bubble ai typing-bubble"><span></span><span></span><span></span></div>'; msgsDiv.appendChild(r); msgsDiv.scrollTop=msgsDiv.scrollHeight; }
function removeTyping(){ document.getElementById('typRow')?.remove(); }

function copyMsg(id,btn){ const text=document.getElementById(id)?.textContent||''; navigator.clipboard.writeText(text).then(()=>{ btn.textContent='✅ Copied!'; btn.classList.add('copied'); setTimeout(()=>{ btn.textContent='📋 Copy'; btn.classList.remove('copied'); },2000); }).catch(()=>showToast('Copy नहीं हुआ!')); }
function speakMsg(id){ const t=document.getElementById(id)?.textContent||''; if(isSpeaking){stopSpeaking();return;} speakText(t); }

// ---- SEND ----
async function sendMessage(){
  const text=userInput.value.trim(); if(!text||isBusy) return;
  if(!currentChatId){ newChat(); await new Promise(r=>setTimeout(r,400)); }

  // Bad word filter
  if(isBadQuestion(text)){
    userInput.value='';
    addAIMsg('😊 यह सवाल ठीक नहीं है! अच्छे सवाल पूछो — पढ़ाई, GK, Maths, Science! GURUJIAI सिर्फ अच्छी बातें सिखाता है! 🙏', true);
    return;
  }

  // Creator question detect
  const creatorQ = ['किसने बनाया','kisne banaya','who made','who created','creator','बनाने वाले','developer','founder'];
  if(creatorQ.some(q=>text.toLowerCase().includes(q))){
    userInput.value='';
    allChats[currentChatId].messages.push({role:'user',content:text});
    saveChats();
    _addUserMsgDOM(text);
    document.getElementById('quickWrap').style.display='none';
    setTimeout(()=>{ showCreatorCard(); },400);
    return;
  }

  stopSpeaking(); extractInfo(text);
  document.getElementById('quickWrap').style.display='none';
  allChats[currentChatId].messages.push({role:'user',content:text});
  if(allChats[currentChatId].messages.length===1){ allChats[currentChatId].title=text.slice(0,30)+(text.length>30?'...':''); headerName.textContent=allChats[currentChatId].title; }
  saveChats();
  _addUserMsgDOM(text); userInput.value=''; userInput.style.height='auto';
  isBusy=true; sendBtn.disabled=true; statusText.textContent='सोच रहा हूँ...';
  addTyping();

  const history=allChats[currentChatId].messages.slice(-20).map(m=>({role:m.role,content:m.content}));
  const mc=userName?'बच्चे का नाम: '+userName+'. नाम लेकर बात करो.':'';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:800,
        system:'तुम GURUJIAI हो — एक बहुत समझदार और प्यारे AI गुरुजी।\n'+mc+'\nनियम:\n- कोई भी अच्छे सवाल का जवाब दो — पढ़ाई, GK, Science, Maths, Hindi, English, जीवन\n- सरल हिंदी में जवाब दो — plain text, कोई ** या # नहीं\n- छोटे और clear जवाब दो\n- शाबाश! बहुत अच्छा! वाह! जैसे शब्द use करो\n- गलत spelling हो तो प्यार से सुधारो\n- गंदे या गलत सवाल का जवाब मत दो',
        messages:history
      })
    });
    const data=await res.json(); removeTyping();
    if(data.content?.[0]?.text){
      const reply=data.content[0].text.replace(/\*\*(.*?)\*\*/g,'').replace(/\*(.*?)\*/g,'').replace(/#{1,6}\s/g,'').trim();
      allChats[currentChatId].messages.push({role:'assistant',content:reply}); saveChats();
      addAIMsg(reply,true);
    } else { addAIMsg('माफ करना! कुछ गड़बड़ हो गई। दोबारा पूछो! 😊',false); }
  } catch(e){ removeTyping(); addAIMsg('Internet से जुड़ने में दिक्कत है। थोड़ी देर बाद try करो! 🙏',false); }
  finally{ isBusy=false; sendBtn.disabled=false; statusText.textContent=userName?'नमस्ते '+userName+'!':'तैयार हूँ!'; }
}

function sendQuick(t){ userInput.value=t; sendMessage(); }

// ---- INIT ----
window.speechSynthesis?.getVoices();
renderMessages();
startTimer();
</script>
